boot {
    default = "m1892-public-root"
    timeout = 0
    title = "M1892 Mainline Linux"
    console_log = true
    direct_failure_hold = true
    uefi_probe = false
    uefi_bootmenu = false

    configs {
        m1892-public-root {
            mode = "linux"
            desc = "M1892 firmware-free public root handoff"
            show = true
            enabled = true
            icon = "linux.svg"
            extra {
                use_efi = true
                use_kernel_fdt_ramdisk_abootimg = true
                skip_kernel_fdt_cmdline = true
                skip_dtbo = true
                force_dtb_after_kernel = true
                add_simplefb = false
                update_splash = false
            }
        }

        continue {
            mode = "linux"
            desc = "M1892 public root (failsafe alias)"
            show = true
            enabled = true
            icon = "linux.svg"
            extra {
                use_efi = true
                use_kernel_fdt_ramdisk_abootimg = true
                skip_kernel_fdt_cmdline = true
                skip_dtbo = true
                force_dtb_after_kernel = true
                add_simplefb = false
                update_splash = false
            }
        }
    }
}
