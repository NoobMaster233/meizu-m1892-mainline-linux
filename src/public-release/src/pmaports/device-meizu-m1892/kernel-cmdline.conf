# Keep the console enabled: SDM845 devices have a documented display-init race,
# and M1892 still needs visible early diagnostics plus autonomous USB recovery.
console=ttyMSM0,115200n8
# The commissioned Linux root is the complete ext4 filesystem on the Android
# userdata partition.  It contains /boot itself, so tell the postmarketOS
# initramfs not to wait for a separate pmOS_boot partition.
pmos.root=/dev/sda19
pmos.stowaway
-quiet
