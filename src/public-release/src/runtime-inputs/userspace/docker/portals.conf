[preferred]
# Phosh already uses these desktop portals.  Keep the standard providers and
# explicitly disable only the Secret portal on the passwordless development
# image: otherwise Flatpak Pods blocks at startup waiting for a locked login
# keyring which cannot be unlocked by the passwordless greetd session.
default=phrosh;phosh;gtk;
org.freedesktop.impl.portal.Access=phosh-shell;
org.freedesktop.impl.portal.Background=none;
org.freedesktop.impl.portal.Clipboard=none;
org.freedesktop.impl.portal.GlobalShortcuts=none;
org.freedesktop.impl.portal.InputCapture=none;
org.freedesktop.impl.portal.RemoteDesktop=none;
org.freedesktop.impl.portal.ScreenCast=wlr;
org.freedesktop.impl.portal.Screenshot=gtk;wlr;
org.freedesktop.impl.portal.Secret=none;
org.freedesktop.impl.portal.Usb=none;
