#
# The M1892 WLAN protection domain is announced by MPSS only when the Qualcomm
# PD mapper is already available.  Keep this invariant in kmod itself so it
# also applies when qcom_q6v5_mss is loaded by udev instead of the OpenRC
# bootstrap service.
softdep qcom_q6v5_mss pre: qcom_pd_mapper

# The platform modalias otherwise lets udev bind WLAN while MPSS is still in
# its early recovery window.  Blacklist affects alias-driven autoload only;
# m1892-radio-bootstrap loads ath10k_snoc explicitly after MPSS has remained
# running for three seconds.
blacklist ath10k_snoc
