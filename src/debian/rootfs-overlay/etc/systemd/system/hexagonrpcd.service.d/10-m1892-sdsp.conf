[Unit]
After=
Requires=m1892-persist-sensors.service
After=m1892-persist-sensors.service

[Service]
# Debian's packaged launcher already selects /dev/fastrpc-sdsp and the sdsp
# domain for qcom,sdm845. Point its documented firmware-root setting at the
# owner-local tree generated from this phone's official Flyme package.
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/sdm845/Meizu/m1892
Restart=on-failure
RestartSec=1s
