# The M1892 QDSP6 multimedia back ends are fixed to S16_LE.  Restrict the
# desktop ALSA nodes to the same format so SPA does not select S24_LE for the
# front end and leave the DSP to bridge incompatible sample widths.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
      { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]

# The codec capture route is already amplified in hardware.  Start new owner
# profiles at 35% on PipeWire's cubic UI scale (0.35^3) to leave headroom for
# speech and prevent communication clients from clipping the source.
wireplumber.settings = {
  device.routes.default-source-volume = 0.042875
}
