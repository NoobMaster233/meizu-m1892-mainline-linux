# SPDX-License-Identifier: CC0-1.0
---
defaultGroups:
  - { name: users, must_exist: true, system: true }
  - { name: sudo, must_exist: true, system: true }
  - { name: audio, must_exist: true, system: true }
  - { name: video, must_exist: true, system: true }
  - { name: input, must_exist: true, system: true }
  - { name: render, must_exist: true, system: true }
  - { name: netdev, must_exist: true, system: true }
  - { name: bluetooth, must_exist: true, system: true }
  - { name: docker, must_exist: true, system: true }

sudoersGroup: sudo
autologinGroup: ""
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
doAutologin: true

passwordRequirements:
  minLength: 4
  maxLength: 128
  libpwquality:
    - minlen=4
    - minclass=1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: ["_apt", "_flatpak", "_ssh", "adm", "audio", "backup", "bin", "bluetooth", "cdrom", "clock", "daemon", "dialout", "dip", "disk", "docker", "fastrpc", "fax", "floppy", "games", "input", "irc", "kmem", "kvm", "list", "lp", "m1892-live", "m1892-setup", "mail", "man", "messagebus", "netdev", "news", "nobody", "nogroup", "operator", "pipewire", "plugdev", "polkitd", "proxy", "render", "root", "rtkit", "sasl", "sddm", "sgx", "shadow", "src", "sshd", "staff", "sudo", "sync", "sys", "systemd-journal", "systemd-network", "systemd-timesync", "tape", "tss", "tty", "users", "utmp", "uucp", "video", "voice", "www-data"]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "m1892-${login}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
presets:
  fullName:
    editable: true
  loginName:
    editable: true
