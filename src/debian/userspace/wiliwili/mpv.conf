# M1892 Qualcomm Venus via FFmpeg's standard V4L2 M2M decoder.
# Other codecs continue through mpv's normal decoder fallback.
vd=h264_v4l2m2m

# The private FFmpeg decoder exports Venus capture buffers as DRM_PRIME;
# select its internal zero-copy method so mpv imports the DMA-BUF directly.
hwdec=v4l2m2m
