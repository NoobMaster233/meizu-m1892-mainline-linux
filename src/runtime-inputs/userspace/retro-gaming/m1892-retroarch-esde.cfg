# Per-launch overrides for RetroArch started from the native Wayland ES-DE build.
# Keep the physical GameSir path on udev while allowing compositor-injected
# keyboard events to drive unattended acceptance tests.
input_driver = "wayland"
input_joypad_driver = "udev"
input_autodetect_enable = "true"

# ES-DE launches RetroArch without a fullscreen flag on upstream Linux ARM.
# Keep the phone UI out of the game surface and make the physical controller
# escape path deterministic.
video_fullscreen = "true"
video_windowed_fullscreen = "true"
input_enable_hotkey_btn = "15"
input_exit_emulator_btn = "16"
input_menu_toggle_btn = "8"
input_pause_toggle_btn = "5"
input_screenshot_btn = "6"
input_fps_toggle_btn = "9"
input_save_state_btn = "12"
input_load_state_btn = "11"
input_state_slot_increase_btn = "h0up"
input_state_slot_decrease_btn = "h0down"
input_rewind_btn = "nul"
input_rewind_axis = "+5"
input_hold_fast_forward_btn = "nul"
input_toggle_fast_forward_axis = "+4"
input_shader_prev_axis = "nul"
input_shader_next_axis = "nul"
quit_press_twice = "true"
