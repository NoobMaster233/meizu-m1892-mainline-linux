#
# The M1892 WLAN protection domain is announced by MPSS only when the Qualcomm
# PD mapper is already available.  Keep this invariant in kmod itself so it
# also applies when qcom_q6v5_mss is loaded by udev instead of the OpenRC
# bootstrap service.
softdep qcom_q6v5_mss pre: qcom_pd_mapper
