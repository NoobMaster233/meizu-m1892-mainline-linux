# M1892 mainline Qualcomm Q6Voice call route.
#
# The modem voice stream itself is the hostless VoiceMMode1 PCM opened by
# q6voiced.  UCM routes downlink through the accepted QUAT/CS35L41 speakers
# and uplink through the accepted WCD9340 handset microphone route;
# it does not replace or bypass ModemManager/Calls.

SectionVerb {
	EnableSequence [
		# PulseAudio/callaudiod need ordinary usable sink/source endpoints for
		# the Voice Call profile.  q6voiced separately opens hostless PCM 0.
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"

		# Establish the two common modem/backend links.  The Earpiece and
		# Speaker devices below select only the physical output; one capture
		# route remains active for the full call to avoid a SLIM channel fault.
		cset "name='Left PCM Source' ASP"
		cset "name='Right PCM Source' ASP"
		cset "name='Left PCM Soft Ramp' 30ms"
		cset "name='Right PCM Soft Ramp' 30ms"
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"

		# Keep one accepted microphone route alive for the complete call.  A
		# live TX6 -> TX1 switch makes the WCD9340 SLIM satellite close TX6
		# and subsequently time out DEF_ACT_CHAN, permanently silencing uplink
		# for that call.  Output-device changes must therefore not reconfigure
		# the active capture channel.  TX6/DEC6/ADC1 is the attended handset
		# microphone route and remains suitable while speakerphone is enabled.
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='AMIC MUX1' ZERO"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='ADC3 Volume' 0"
		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"
		cset "name='IIR0 INP0 MUX' DEC6"
		cset "name='ADC1 Volume' 12"
	]

	DisableSequence [
		cset "name='ADC1 Volume' 0"
		cset "name='AMIC MUX6' ZERO"
		cset "name='CDC_IF TX6 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"
		cset "name='ADC3 Volume' 0"
		cset "name='AMIC MUX1' ZERO"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='Left Digital PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 0"
		cset "name='Left Analog PCM Volume' 0"
		cset "name='Right Analog PCM Volume' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in stereo speakerphone"

	EnableSequence [
		# Flyme voice-speaker: RCV + SPK in Handsfree mode.  In the
		# mainline card the stock SPK is Left and RCV is Right.
		cset "name='Left Digital PCM Volume' 650"
		cset "name='Right Digital PCM Volume' 650"
		cset "name='Left Analog PCM Volume' 16"
		cset "name='Right Analog PCM Volume' 15"

		# PulseAudio 17 exposes the earpiece and speaker combinations as
		# separate profiles.  Switching between them may tear down and
		# recreate the shared Voice Call verb.  Reassert the hostless modem
		# links after the device route so that a profile switch cannot leave
		# VoiceMMode1 open but disconnected.
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='Left Digital PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 0"
		cset "name='Left Analog PCM Volume' 0"
		cset "name='Right Analog PCM Volume' 0"
	]

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
		# PCM 1 is the ordinary MultiMedia1 endpoint exposed to PulseAudio.
		# MultiMedia2 capture endpoint is PCM 2 on the product kernel; the
		# actual modem stream remains on hostless VoiceMMode1 PCM 0.
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Earpiece" {
	Comment "Built-in receiver"

	EnableSequence [
		# Flyme voice-handset uses only the RCV amplifier at low gain.
		cset "name='Left Digital PCM Volume' 0"
		cset "name='Left Analog PCM Volume' 0"
		cset "name='Right Digital PCM Volume' 650"
		cset "name='Right Analog PCM Volume' 2"

		# See Speaker above: these are shared VoiceMMode1 links and must be
		# asserted by every split Voice Call profile.
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='Right Digital PCM Volume' 0"
		cset "name='Right Analog PCM Volume' 0"
	]

	Value {
		PlaybackPriority 400
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Mic" {
	Comment "Built-in call microphone"

	Value {
		CapturePriority 300
		CaptureChannels 1
		# The released VoiceMMode1/MultiMedia1/MultiMedia2 topology
		# enumerates the ordinary capture endpoint as PCM 2.
		CapturePCM "hw:${CardId},2"
	}
}
