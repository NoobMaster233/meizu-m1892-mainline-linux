Syntax 4

SectionUseCase."HiFi" {
	File "/Meizu/m1892/HiFi.conf"
	Comment "M1892 mainline built-in speaker audio"
}

SectionUseCase."Voice Call" {
	File "/Meizu/m1892/VoiceCall.conf"
	Comment "M1892 modem voice call through the built-in speakerphone"
}

BootSequence [
	# Conservative handset receiver and primary analog microphone gains.
	cset "name='RX0 Digital Volume' 50"
	cset "name='EAR PA Volume' 4"
	cset "name='ADC1 Volume' 16"
	cset "name='DEC7 Volume' 75"
]
